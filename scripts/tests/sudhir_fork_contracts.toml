source = ["scripts/sudhir-codex.ps1", "sudhir_codex/src/sudhir_codex_gateway/platform_support.py", "sudhir_codex/src/sudhir_codex_gateway/management.py"]
test_file = "scripts/tests/sudhir_windows_packaging_contracts.py"
test_runner = "python-unittest"
test_name = "WindowsPackagingContracts.test_native_gateway_lifecycle"
acceptance_case = "windows-native-startup"
acceptance_mode = "ci"
acceptance_hosts = ["github-windows"]
lane = "packaging"
platforms = ["windows"]
always = false

[[contract.ci_checks]]
inventory_id = "WF-752c57dbaf58926a"
workflow = ".github/workflows/source-ci.yml"
job = "gateway-windows"
step = "Smoke-test Windows installation and gateway lifecycle"
command = "$SmokeRoot = Join-Path $env:RUNNER_TEMP \"openmodels-installer-smoke\"\n$ArchiveRoot = Join-Path $SmokeRoot \"archive\"\n$InstallRoot = Join-Path $SmokeRoot \"checkout\"\n$State = Join-Path $SmokeRoot \"state\"\n$PiAgentDir = Join-Path $SmokeRoot \"pi-agent\"\nNew-Item -ItemType Directory -Path $ArchiveRoot, $InstallRoot -Force | Out-Null\n$Binaries = @(\n  \"codex.exe\",\n  \"codex-app-server.exe\",\n  \"codex-code-mode-host.exe\",\n  \"codex-command-runner.exe\",\n  \"codex-responses-api-proxy.exe\",\n  \"codex-windows-sandbox-setup.exe\"\n)\nforeach ($Binary in $Binaries) {\n  Set-Content -LiteralPath (Join-Path $ArchiveRoot $Binary) -Value \"smoke\" -Encoding Ascii\n}\n$Archive = Join-Path $env:RUNNER_TEMP \"codex-with-openmodels-x86_64-pc-windows-msvc.zip\"\nCompress-Archive -Path (Join-Path $ArchiveRoot \"*.exe\") -DestinationPath $Archive\n$Checksums = Join-Path $env:RUNNER_TEMP \"SHA256SUMS\"\n$Hash = (Get-FileHash -LiteralPath $Archive -Algorithm SHA256).Hash.ToLowerInvariant()\n\"$Hash  $([System.IO.Path]::GetFileName($Archive))\" |\n  Set-Content -LiteralPath $Checksums -Encoding Ascii\n\nNew-Item -ItemType Directory -Path `\n  (Join-Path $InstallRoot \"codex-rs\"), `\n  (Join-Path $InstallRoot \"sudhir_codex\\cursor_worker\") `\n  -Force | Out-Null\nCopy-Item -LiteralPath .\\sudhir_codex\\pyproject.toml `\n  -Destination (Join-Path $InstallRoot \"sudhir_codex\\pyproject.toml\")\nCopy-Item -LiteralPath .\\sudhir_codex\\src `\n  -Destination (Join-Path $InstallRoot \"sudhir_codex\\src\") `\n  -Recurse\nCopy-Item -Path .\\sudhir_codex\\cursor_worker\\package*.json `\n  -Destination (Join-Path $InstallRoot \"sudhir_codex\\cursor_worker\")\nCopy-Item -LiteralPath .\\sudhir_codex\\cursor_worker\\worker.mjs `\n  -Destination (Join-Path $InstallRoot \"sudhir_codex\\cursor_worker\\worker.mjs\")\nCopy-Item -LiteralPath .\\sudhir_codex\\cursor_worker\\pi-auth-worker.mjs `\n  -Destination (Join-Path $InstallRoot \"sudhir_codex\\cursor_worker\\pi-auth-worker.mjs\")\n\n& .\\scripts\\sudhir-codex.ps1 `\n  -Archive $Archive `\n  -Checksums $Checksums `\n  -Root $InstallRoot `\n  -State $State `\n  -PiAgentDir $PiAgentDir\n\n$GatewayPython = Join-Path $InstallRoot \".venv\\Scripts\\python.exe\"\n$env:SUDHIR_CODEX_ROOT = $InstallRoot\n$env:SUDHIR_CODEX_STATE = $State\n$env:SUDHIR_CODEX_PI_AGENT_DIR = $PiAgentDir\n$Started = $false\ntry {\n  & $GatewayPython -m sudhir_codex_gateway.management start\n  $GatewayStartExit = $LASTEXITCODE\n  if ($GatewayStartExit -ne 0) {\n    $GatewayLog = Join-Path $State \"gateway\\gateway.log\"\n    if (Test-Path -LiteralPath $GatewayLog -PathType Leaf) {\n      Get-Content -LiteralPath $GatewayLog\n    }\n    throw \"Gateway start smoke failed\"\n  }\n  $Started = $true\n\n  $StatusJson = (& $GatewayPython -m sudhir_codex_gateway.management status --json) -join \"`n\"\n  if ($LASTEXITCODE -ne 0) { throw \"Gateway status smoke failed\" }\n  $Status = $StatusJson | ConvertFrom-Json\n  if (-not $Status.running) { throw \"Gateway status did not report running\" }\n}\nfinally {\n  if ($Started) {\n    & $GatewayPython -m sudhir_codex_gateway.management stop\n    if ($LASTEXITCODE -ne 0) { throw \"Gateway stop smoke failed\" }\n  }\n}\nif (Test-Path -LiteralPath (Join-Path $State \"gateway\\gateway.pid\")) {\n  throw \"Gateway PID file remained after stop\"\n}"
working_directory = ""
shell = "pwsh"
platforms = ["windows"]
