[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sudhir-codex-gateway"
version = "0.1.0"
description = "Private GPT and Pi model gateway for Sudhir-Codex"
requires-python = ">=3.11"
dependencies = [
    "httpx==0.28.1",
]

[project.scripts]
sudhir-codex-gateway = "sudhir_codex_gateway.management:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
