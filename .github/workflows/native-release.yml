name: native-release

on:
  push:
    tags:
      - "openmodels-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing openmodels-v* tag pointing at the selected commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  tag-check:
    name: Validate release tag and commit
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.validate.outputs.release_tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate selected tag
        id: validate
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^openmodels-v[0-9][0-9A-Za-z._-]*$ ]]
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          [[ "$tag_commit" == "$GITHUB_SHA" ]]
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  macos:
    name: Apple Silicon macOS bundle
    needs: tag-check
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: aarch64-apple-darwin
      - name: Configure rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: aarch64-apple-darwin

      - name: Build required macOS binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build \
            --locked \
            --target aarch64-apple-darwin \
            --release \
            --bin codex \
            --bin codex-code-mode-host \
            --bin codex-responses-api-proxy

      - name: Strip, ad-hoc sign, and smoke-test
        shell: bash
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/openmodels-macos"
          release="target/aarch64-apple-darwin/release"
          rm -rf "$stage"
          mkdir -p "$stage"
          for binary in codex codex-code-mode-host codex-responses-api-proxy; do
            cp "$release/$binary" "$stage/$binary"
            strip -S -x "$stage/$binary"
            codesign --force --sign - "$stage/$binary"
            codesign --verify --verbose=2 "$stage/$binary"
            file "$stage/$binary" | grep -q 'arm64'
            lipo -verify_arch arm64 "$stage/$binary"
          done
          "$stage/codex" --version
          "$stage/codex" --help >/dev/null
          "$stage/codex" app-server --help >/dev/null
          "$stage/codex" mcp-server --help >/dev/null

          archive="${GITHUB_WORKSPACE}/codex-with-openmodels-aarch64-apple-darwin.tar.gz"
          tar -C "$stage" -czf "$archive" \
            codex \
            codex-code-mode-host \
            codex-responses-api-proxy

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: macos-release-archive
          path: codex-with-openmodels-aarch64-apple-darwin.tar.gz
          if-no-files-found: error
          retention-days: 3

  ubuntu:
    name: Ubuntu 22.04 x64 MUSL bundle
    needs: tag-check
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-unknown-linux-musl

      - name: Use a hermetic Cargo home
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${GITHUB_WORKSPACE}/.cargo-home"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "$GITHUB_ENV"
          echo "${cargo_home}/bin" >> "$GITHUB_PATH"
          : > "${cargo_home}/config.toml"

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false

      - name: Install MUSL build tools
        env:
          TARGET: x86_64-unknown-linux-musl
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"

      - name: Disable aws-lc jitter entropy
        shell: bash
        run: |
          set -euo pipefail
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY_x86_64_unknown_linux_musl=1" >> "$GITHUB_ENV"

      - name: Configure rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-musl

      - name: Build, strip, and hash bundled bwrap
        shell: bash
        run: |
          set -euo pipefail
          target="x86_64-unknown-linux-musl"
          cargo build --locked --target "$target" --release --bin bwrap
          bwrap="target/${target}/release/bwrap"
          strip --strip-debug --strip-unneeded "$bwrap"
          digest="$(sha256sum "$bwrap" | awk '{print $1}')"
          echo "CODEX_BWRAP_SHA256=$digest" >> "$GITHUB_ENV"
          echo "Bundled bwrap sha256:$digest"

      - name: Build required Linux binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build \
            --locked \
            --target x86_64-unknown-linux-musl \
            --release \
            --bin codex \
            --bin codex-code-mode-host \
            --bin codex-responses-api-proxy

      - name: Strip, stage, and smoke-test
        shell: bash
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/openmodels-linux"
          release="target/x86_64-unknown-linux-musl/release"
          rm -rf "$stage"
          mkdir -p "$stage/codex-resources"
          for binary in codex codex-code-mode-host codex-responses-api-proxy; do
            cp "$release/$binary" "$stage/$binary"
            strip --strip-debug --strip-unneeded "$stage/$binary"
            file "$stage/$binary" | grep -Eq 'x86-64|x86_64'
          done
          cp "$release/bwrap" "$stage/codex-resources/bwrap"
          file "$stage/codex-resources/bwrap" | grep -Eq 'x86-64|x86_64'
          "$stage/codex" --version
          "$stage/codex" --help >/dev/null
          "$stage/codex" app-server --help >/dev/null
          "$stage/codex" mcp-server --help >/dev/null

          archive="${GITHUB_WORKSPACE}/codex-with-openmodels-x86_64-unknown-linux-musl.tar.gz"
          tar -C "$stage" -czf "$archive" \
            codex \
            codex-code-mode-host \
            codex-responses-api-proxy \
            codex-resources/bwrap

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ubuntu-release-archive
          path: codex-with-openmodels-x86_64-unknown-linux-musl.tar.gz
          if-no-files-found: error
          retention-days: 3

  windows:
    name: Windows x64 bundle
    needs: tag-check
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs
    env:
      LIBSQLITE3_FLAGS: SQLITE_DISABLE_INTRINSIC
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Configure short Windows build paths
        shell: pwsh
        run: |
          $BuildRoot = Join-Path $env:RUNNER_TEMP "codex-build"
          $CargoTarget = Join-Path $BuildRoot "target"
          $Temp = Join-Path $BuildRoot "tmp"
          New-Item -ItemType Directory -Path $CargoTarget, $Temp -Force | Out-Null
          "CARGO_TARGET_DIR=$CargoTarget" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEMP=$Temp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$Temp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          git config --global core.longpaths true
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-pc-windows-msvc
      - name: Configure the MSVC and Windows SDK environment
        uses: ./.github/actions/setup-msvc-env
        with:
          target: x86_64-pc-windows-msvc

      - name: Build required Windows binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build \
            --locked \
            --target x86_64-pc-windows-msvc \
            --release \
            --bin codex \
            --bin codex-code-mode-host \
            --bin codex-responses-api-proxy \
            --bin codex-app-server \
            --bin codex-windows-sandbox-setup \
            --bin codex-command-runner

      - name: Stage and smoke-test native Windows binaries
        shell: pwsh
        run: |
          $Target = "x86_64-pc-windows-msvc"
          $Release = Join-Path $env:CARGO_TARGET_DIR "$Target\release"
          $Stage = Join-Path $env:RUNNER_TEMP "openmodels-windows"
          New-Item -ItemType Directory -Path $Stage -Force | Out-Null
          $Binaries = @(
            "codex.exe",
            "codex-app-server.exe",
            "codex-code-mode-host.exe",
            "codex-command-runner.exe",
            "codex-responses-api-proxy.exe",
            "codex-windows-sandbox-setup.exe"
          )
          foreach ($Binary in $Binaries) {
            $Source = Join-Path $Release $Binary
            if (-not (Test-Path -LiteralPath $Source -PathType Leaf)) {
              throw "Missing runtime binary $Source"
            }
            Copy-Item -LiteralPath $Source -Destination (Join-Path $Stage $Binary)
            $Headers = & dumpbin.exe /headers $Source
            if (($Headers -join "`n") -notmatch "8664 machine \(x64\)") {
              throw "$Binary is not an x64 PE binary"
            }
          }
          & (Join-Path $Stage "codex.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "codex.exe --version failed" }
          & (Join-Path $Stage "codex.exe") --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "codex.exe --help failed" }
          & (Join-Path $Stage "codex.exe") app-server --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "codex.exe app-server --help failed" }
          & (Join-Path $Stage "codex.exe") mcp-server --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "codex.exe mcp-server --help failed" }

          $Archive = Join-Path $env:GITHUB_WORKSPACE "codex-with-openmodels-x86_64-pc-windows-msvc.zip"
          Compress-Archive -Path (Join-Path $Stage "*.exe") -DestinationPath $Archive
          $Checksums = Join-Path $env:RUNNER_TEMP "SHA256SUMS"
          $Hash = (Get-FileHash -LiteralPath $Archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$Hash  $([System.IO.Path]::GetFileName($Archive))" |
            Set-Content -LiteralPath $Checksums -Encoding Ascii
          & "$env:GITHUB_WORKSPACE\scripts\sudhir-codex.ps1" `
            -Archive $Archive `
            -Checksums $Checksums `
            -ValidateArchiveOnly

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-release-archive
          path: codex-with-openmodels-x86_64-pc-windows-msvc.zip
          if-no-files-found: error
          retention-days: 3

  release:
    name: Assemble checksums and draft pre-release
    needs:
      - tag-check
      - macos
      - ubuntu
      - windows
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-release-archive"
          merge-multiple: true
          path: release-assets

      - name: Verify archives and create SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          expected=(
            codex-with-openmodels-aarch64-apple-darwin.tar.gz
            codex-with-openmodels-x86_64-pc-windows-msvc.zip
            codex-with-openmodels-x86_64-unknown-linux-musl.tar.gz
          )
          for archive in "${expected[@]}"; do
            test -f "$archive"
          done
          [[ "$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')" == "3" ]]
          tar -tzf codex-with-openmodels-aarch64-apple-darwin.tar.gz >/dev/null
          tar -tzf codex-with-openmodels-x86_64-unknown-linux-musl.tar.gz >/dev/null
          unzip -t codex-with-openmodels-x86_64-pc-windows-msvc.zip >/dev/null
          sha256sum "${expected[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: complete-release-candidate
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Create or refresh the draft pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.tag-check.outputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft="$(
              gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
                --jq '.draft'
            )"
            [[ "$draft" == "true" ]] || {
              echo "Refusing to replace assets on a non-draft release" >&2
              exit 1
            }
            gh release upload "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              release-assets/*
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --target "$GITHUB_SHA" \
              --draft \
              --prerelease \
              --title "$RELEASE_TAG" \
              --notes "Owner-validation candidate built once for macOS arm64, Ubuntu 22.04 x64, and Windows x64. Verify SHA256SUMS before testing. The Windows archive is unsigned." \
              release-assets/*
          fi
