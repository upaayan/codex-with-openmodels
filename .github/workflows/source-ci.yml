name: source-ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fork-contracts-linux:
    name: Fork contracts (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: sudhir_codex/cursor_worker/package-lock.json
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"

      - name: Install compile-free contract dependencies
        run: python -m pip install --disable-pip-version-check --editable ./sudhir_codex ruff==0.15.13

      - name: Verify and run the Linux prebuild gate
        run: |
          python3 scripts/tests/verify_sudhir_fork_contracts.py lint --platform linux
          python3 scripts/tests/run_sudhir_fork_contracts.py --platform linux \
            --phase prebuild \
            --evidence fork-contract-tests-linux.json

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: source-fork-contracts-linux
          path: fork-contract-tests-linux.json
          if-no-files-found: error
          retention-days: 7

  fork-contracts-windows:
    name: Fork contracts (Windows)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: sudhir_codex/cursor_worker/package-lock.json

      - name: Install exact contract dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --editable ./sudhir_codex ruff==0.15.13

      - name: Verify and run the Windows prebuild gate
        shell: pwsh
        run: |
          python scripts/tests/verify_sudhir_fork_contracts.py lint --platform windows
          python scripts/tests/run_sudhir_fork_contracts.py --platform windows `
            --phase prebuild `
            --evidence fork-contract-tests-windows.json

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: source-fork-contracts-windows
          path: fork-contract-tests-windows.json
          if-no-files-found: error
          retention-days: 7
